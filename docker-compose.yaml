services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: service-balance-app:local
    container_name: service-balance-app
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8080}:8080"

    env_file:
      - .env

    environment:
      APPLICATION_HOST: "0.0.0.0"
      APPLICATION_PORT: "8080"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:latest
    container_name: service-balance
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${DATABASE_NAME:?DATABASE_NAME is required}"
      POSTGRES_USER: "${DATABASE_USER:?DATABASE_USER is required}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}"

    ports:
      - "127.0.0.1:${DATABASE_EXTERNAL_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: