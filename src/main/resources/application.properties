debug=false
spring.application.name=${APPLICATION_NAME}
spring.application.version=${APPLICATION_VERSION}
server.port=${APPLICATION_PORT}
server.address=${APPLICATION_HOST}
spring.r2dbc.url=r2dbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.r2dbc.username=${DATABASE_USER}
spring.r2dbc.password=${DATABASE_PASSWORD}
base-url=${BASE_URL}
spring.sql.init.mode=always
max-retry=${MAX_RETRY}
max-duration-timeout=${MAX_DURATION_TIMEOUT}
springdoc.swagger-ui.doc-expansion=none